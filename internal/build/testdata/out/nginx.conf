index index.html index.xml;
set $whiteroom_not_found "/404.html";
if ($uri ~ "^/en/") {
    set $whiteroom_not_found "/en/404.html";
}
error_page 404 $whiteroom_not_found;
location = "/.htaccess" {
    return 404;
}
location = "/" {
    if ($args ~ "^(?=(?:.*&)?p=123(?:&|$))") {
        return 301 "/2026/10/26/%E6%96%B0%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9/";
    }
}
location = "/company" {
    return 301 "/about/";
}
location = "/company/" {
    return 301 "/about/";
}
location = "/home" {
    return 301 "/";
}
location = "/home/" {
    return 301 "/";
}
location = "/old-news" {
    return 301 "/category/news/";
}
location = "/old-news/" {
    return 301 "/category/news/";
}
location = "/recruit" {
    return 302 "https://recruit.example.com/";
}
location = "/recruit/" {
    return 302 "https://recruit.example.com/";
}
location = "/wp-content/uploads/2024/04/会社案内.pdf" {
    return 301 "/media/med_01JB8Z3K5TM8A1C5F9V3J6K2N7/%E4%BC%9A%E7%A4%BE%E6%A1%88%E5%86%85.pdf";
}
location = "/wp-content/uploads/2024/04/会社案内.pdf/" {
    return 301 "/media/med_01JB8Z3K5TM8A1C5F9V3J6K2N7/%E4%BC%9A%E7%A4%BE%E6%A1%88%E5%86%85.pdf";
}
location = "/yamada" {
