{{if .Header -}}
<th{{with .Class}} class="{{.}}"{{end}}{{with .Colspan}} colspan="{{.}}"{{end}}{{with .Rowspan}} rowspan="{{.}}"{{end}}>{{.Content}}</th>
{{- else -}}
<td{{with .Class}} class="{{.}}"{{end}}{{with .Colspan}} colspan="{{.}}"{{end}}{{with .Rowspan}} rowspan="{{.}}"{{end}}>{{.Content}}</td>
{{- end}}
