<figure{{with .Anchor}} id="{{.}}"{{end}}{{with .Class}} class="{{.}}"{{end}}>
{{- if .Src -}}
<iframe src="{{.Src}}" width="{{.Width}}" height="{{.Height}}" title="{{.Title}}" loading="lazy"{{with .Allow}} allow="{{.}}"{{end}}{{with .ReferrerPolicy}} referrerpolicy="{{.}}"{{end}} allowfullscreen></iframe>
{{- else -}}
<p><a href="{{.URL}}">{{.URL}}</a></p>
{{- end -}}
{{with .Caption}}<figcaption>{{.}}</figcaption>{{end}}</figure>
