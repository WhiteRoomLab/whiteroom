{{template "layout" .}}
{{define "main"}}
<section class="list posts">
{{- with .Title}}
<h1>{{.}}</h1>
{{- end}}
{{- with .Entry}}
{{.Body}}
{{- end}}
{{- range .Entries}}
{{template "entry/card" dict "entry" . "showAuthor" true}}
{{- end}}
{{- with .Pagination}}
{{template "pagination" .}}
{{- end}}
</section>
{{end}}
